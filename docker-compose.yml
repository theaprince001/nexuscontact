services:
  postgres:
    image: postgres:16-alpine
    container_name: nexuscontact-db
    environment:
      POSTGRES_DB: nexuscontact
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Theaprince001
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./nexuscontact-backend
    container_name: nexuscontact-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexuscontact
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Theaprince001
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./nexuscontact-frontend
    container_name: nexuscontact-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8080/api

volumes:
  postgres_data: